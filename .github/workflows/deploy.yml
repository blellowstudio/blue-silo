name: Build and Deploy Angular to GitHub Pages

defaults:
  run:
    working-directory: blellow-template

on:
  push:
    branches:
      - production

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: blellow-template/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build Angular
        run: |
          npm run build -- --configuration production --base-href "/blue-silo/"

      - name: Upload Pages Artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: blellow-template/dist/blellow-template/browser

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4