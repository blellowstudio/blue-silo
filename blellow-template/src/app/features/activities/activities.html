<section class="activities">

  <div class="container">

    <div class="section-header">

      <span class="subtitle">
        {{ activities.subtitle }}
      </span>

      <h2>
        {{ activities.title }}
      </h2>

      <p>
        {{ activities.description }}
      </p>

    </div>

    <div class="activities-grid">

      <div
        class="activity-card"
        *ngFor="let card of activities.cards">

<div class="icon">
  <i [class]="card.icon"></i>
</div>

        <h3>
          {{ card.title }}
        </h3>

        <p>
          {{ card.description }}
        </p>

      </div>

    </div>

  </div>

</section>
