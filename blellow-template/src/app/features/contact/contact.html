<section class="contact" >

  <div class="container">

    <div class="section-header">

      <span class="subtitle">
        {{ contact.subtitle }}
      </span>

      <h2>
        {{ contact.title }}
      </h2>

      <p>
        {{ contact.description }}
      </p>

    </div>

    <div class="contact-content">

      <div class="contact-card">

        <h3>{{ contact.cardTitle }}</h3>

        <div class="info">

          <h4>
            <i class="fas fa-map-marker-alt"></i>
            Address
          </h4>

          @for(line of contact.address; track line){
          <p>{{ line }}</p>
          }

        </div>

        <div class="info">

          <h4>
            <i class="fas fa-phone"></i>
            Phone
          </h4>

          <p>{{ contact.phone }}</p>

        </div>

        <div class="info">

          <h4>
            <i class="fas fa-envelope"></i>
            Email
          </h4>

          <p>{{ contact.email }}</p>

        </div>

        <a href="mailto:{{ contact.email }}" class="primary-btn">

          {{ contact.buttonText }}

        </a>

      </div>

      <div class="map">

        <iframe [src]="mapUrl" width="100%" height="500" style="border:0;" loading="lazy" allowfullscreen>
        </iframe>

      </div>

    </div>

  </div>

</section>
