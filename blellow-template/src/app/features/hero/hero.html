<section class="hero" id="home">

  <div class="hero-content">

    <span class="subtitle">
      {{ hero.subtitle }}
    </span>

    <h1>

      {{ hero.title }}

    </h1>

    <p>
      {{ hero.description }}

    </p>

    <div class="hero-buttons">

      <a class="primary-btn" href="#contact">
        {{ hero.primaryButton }}
      </a>

      <a class="secondary-btn" href="#gallery">
        {{ hero.secondaryButton }}
      </a>

    </div>

  </div>

</section>
